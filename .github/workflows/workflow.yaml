
name: Surveillance Systeme

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

jobs:
  surveillance:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Tester le script d'audit local
        shell: bash
        run: |
          bash -n ./scripts/audit.sh
          bash ./scripts/audit.sh